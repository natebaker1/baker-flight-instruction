<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Baker Flight Instruction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=IBM+Plex+Mono:wght@500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="grid-overlay" aria-hidden="true"></div>

  <nav class="site-nav">
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Me</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="resources.html">Resources</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <header class="page-header">
    <p class="callsign">GET IN TOUCH</p>
    <h1 class="page-title">Contact</h1>
    <p class="page-lede">
      Need a flight instructor? Reach out below.
    </p>
  </header>


  <main>
    <section class="panel">
      <div class="panel-heading">
        <span class="heading-code">·</span>
        <h2>Send a Message</h2>
      </div>
      <form class="contact-form" action="https://formspree.io/f/mbgllpkv" method="POST">
        <div class="form-row">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-row">
          <label for="phone">Phone (optional)</label>
          <input type="tel" id="phone" name="phone">
        </div>
        <div class="form-row">
          <label for="interest">What are you interested in?</label>
          <select id="interest" name="interest">
            <option value="Discovery flight">Discovery flight</option>
            <option value="Private Pilot training">Private Pilot training</option>
            <option value="Instrument Rating">Instrument Rating</option>
            <option value="Commercial Pilot training">Commercial Pilot training</option>
            <option value="Flight review / IPC">Flight review / IPC</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-row">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn-primary">Send message</button>
      </form>
    </section>

    <section class="panel">
      <ul class="contact-list">
        <li>
          <span class="contact-label">LinkedIn</span>
          <a href="https://www.linkedin.com/in/nate-baker-cfii" target="_blank"
            rel="noopener">www.linkedin.com/in/nate-baker-cfii</a>
        </li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>Nate Baker · Dallas-Fort Worth, TX</p>
    <p class="footer-links">
      <a href="support.html">Support</a>
      <span aria-hidden="true">·</span>
      <a href="privacy.html">Privacy Policy</a>
      <span aria-hidden="true">·</span>
      <a href="terms.html">Terms of Service</a>
    </p>
  </footer>

</body>

</html>
